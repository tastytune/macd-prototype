<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4080"/>
      <stop offset="100%" stop-color="#0d2348"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" fill="url(#bgGrad)" rx="6"/>

  <!-- Diagonal shimmer -->
  <polygon points="80,0 120,0 120,60" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Medal ribbon left -->
  <line x1="51" y1="14" x2="44" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Medal ribbon right -->
  <line x1="69" y1="14" x2="76" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ribbon crossbar -->
  <line x1="51" y1="14" x2="69" y2="14" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Medal circle -->
  <circle cx="60" cy="44" r="17" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Inner ring -->
  <circle cx="60" cy="44" r="12" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.5"/>
  <!-- "1" -->
  <text x="60" y="50" font-size="16" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>

  <!-- "12" big number -->
  <text x="60" y="88" font-size="36" font-weight="900" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1">12</text>

  <!-- "CHANNELS" label -->
  <text x="60" y="104" font-size="10" font-weight="600" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="2" fill-opacity="0.9">CHANNELS</text>
</svg>
